name: dist past bij src

# De apps installeren dit pakket van een git-tag en gebruiken dist/ zoals hij
# gecommit is. Een wijziging in src/ zonder `npm run build` komt dus nooit aan,
# en dat zie je nergens (audit POR-08). Deze stap bouwt opnieuw en vergelijkt.

on:
  push:
    paths: ['src/**', 'test/**', 'dist/**', 'package.json', 'package-lock.json', '.babelrc']
  pull_request:

jobs:
  controleer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: dist ongewijzigd na bouwen
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::dist/ past niet bij src/. Draai npm run build en commit dist/."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "::error::Nieuwe bestanden in dist/ die niet gecommit zijn."
            exit 1
          fi
